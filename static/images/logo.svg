<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Outer circle background -->
  <circle cx="100" cy="110" r="95" fill="#FFD700" stroke="#0b7a33" stroke-width="2"/>
  
  <!-- Inner oval/shield shape -->
  <ellipse cx="100" cy="110" r="80" ry="85" fill="#0b7a33" stroke="#0b7a33" stroke-width="2"/>
  
  <!-- Inner yellow oval -->
  <ellipse cx="100" cy="110" r="70" ry="75" fill="#FFD700"/>
  
  <!-- Corn/Maize cob (brown) -->
  <ellipse cx="100" cy="85" rx="12" ry="25" fill="#8B6F47"/>
  
  <!-- Corn kernels -->
  <g fill="#FFD700" stroke="#0b7a33" stroke-width="1">
    <!-- Left column -->
    <circle cx="88" cy="75" r="4"/>
    <circle cx="88" cy="82" r="4"/>
    <circle cx="88" cy="89" r="4"/>
    <circle cx="88" cy="96" r="4"/>
    <circle cx="88" cy="103" r="4"/>
    <circle cx="88" cy="110" r="4"/>
    <circle cx="88" cy="117" r="4"/>
    
    <!-- Right column -->
    <circle cx="112" cy="75" r="4"/>
    <circle cx="112" cy="82" r="4"/>
    <circle cx="112" cy="89" r="4"/>
    <circle cx="112" cy="96" r="4"/>
    <circle cx="112" cy="103" r="4"/>
    <circle cx="112" cy="110" r="4"/>
    <circle cx="112" cy="117" r="4"/>
    
    <!-- Left-front -->
    <circle cx="82" cy="80" r="4"/>
    <circle cx="82" cy="90" r="4"/>
    <circle cx="82" cy="100" r="4"/>
    <circle cx="82" cy="110" r="4"/>
    
    <!-- Right-front -->
    <circle cx="118" cy="80" r="4"/>
    <circle cx="118" cy="90" r="4"/>
    <circle cx="118" cy="100" r="4"/>
    <circle cx="118" cy="110" r="4"/>
  </g>
  
  <!-- Left husk/leaf -->
  <path d="M 75 95 Q 65 90 60 105 Q 65 110 75 105" fill="#0b7a33" stroke="#0b7a33" stroke-width="1"/>
  
  <!-- Right husk/leaf -->
  <path d="M 125 95 Q 135 90 140 105 Q 135 110 125 105" fill="#0b7a33" stroke="#0b7a33" stroke-width="1"/>
  
  <!-- Top left diagonal stick -->
  <line x1="70" y1="55" x2="85" y2="75" stroke="#0b7a33" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Top right diagonal stick -->
  <line x1="130" y1="55" x2="115" y2="75" stroke="#0b7a33" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Bottom left diagonal stick -->
  <line x1="70" y1="165" x2="85" y2="145" stroke="#0b7a33" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Bottom right diagonal stick -->
  <line x1="130" y1="165" x2="115" y2="145" stroke="#0b7a33" stroke-width="3" stroke-linecap="round"/>
  
  <!-- NCPB Text -->
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0b7a33" text-anchor="middle">NCPB</text>
</svg>
